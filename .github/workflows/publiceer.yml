# Test, werk de database bij en publiceer de app op GitHub Pages bij elke push naar main.
# Er wordt enkel gepubliceerd als alle tests slagen én de databasemigraties gelukt zijn.
name: Test en publiceer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bouw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

      # Databasemigraties (supabase/migrations) automatisch toepassen.
      # Vereist de geheimen SUPABASE_ACCESS_TOKEN en SUPABASE_DB_PASSWORD; zonder die geheimen wordt deze stap overgeslagen.
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Database bijwerken
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::warning::Supabase-geheimen ontbreken; databasemigraties overgeslagen."
            exit 0
          fi
          supabase link --project-ref "$SUPABASE_PROJECT_ID" -p "$SUPABASE_DB_PASSWORD"
          # Migratie 1 werd manueel uitgevoerd vóór deze automatisering; markeer ze als toegepast (idempotent).
          supabase migration repair --status applied 20261003000001 -p "$SUPABASE_DB_PASSWORD" || true
          yes | supabase db push -p "$SUPABASE_DB_PASSWORD"

      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # Publieke Supabase-waarden (bedoeld om in de app te staan). Ingesteld als repository-variabelen.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publiceer:
    needs: bouw
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
