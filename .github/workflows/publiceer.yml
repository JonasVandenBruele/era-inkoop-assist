# Test, werk de database bij en publiceer de app op GitHub Pages bij elke push naar main.
# Er wordt enkel gepubliceerd als alle tests slagen én de databasemigraties gelukt zijn.
name: Test en publiceer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bouw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

      # Databasemigraties (supabase/migrations) automatisch toepassen, rechtstreeks via de databaseverbinding.
      # Vereist enkel het geheim SUPABASE_DB_PASSWORD; zonder dat geheim wordt deze stap overgeslagen.
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Database bijwerken
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_HOST: ${{ vars.SUPABASE_DB_HOST }}
        run: |
          if [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_ID" ] || [ -z "$SUPABASE_DB_HOST" ]; then
            echo "::warning::Supabase-gegevens ontbreken; databasemigraties overgeslagen."
            exit 0
          fi
          WW=$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"], safe=""))')
          echo "::add-mask::$WW"
          DB_URL="postgresql://postgres.${SUPABASE_PROJECT_ID}:${WW}@${SUPABASE_DB_HOST}:5432/postgres"
          # Migratie 1 werd manueel uitgevoerd vóór deze automatisering; markeer ze als toegepast (idempotent).
          supabase migration repair --status applied 20261003000001 --db-url "$DB_URL"
          yes | supabase db push --db-url "$DB_URL"

      # Importgebruiker voor de ERAForce-mirror (fase 8): aanmelden met het geheim MIRROR_IMPORT_PASSWORD.
      # De rol zelf (enkel ERAForce-rijen) komt uit migratie 20261005000006.
      - name: Importgebruiker ERAForce-mirror
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          MIRROR_IMPORT_PASSWORD: ${{ secrets.MIRROR_IMPORT_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_HOST: ${{ vars.SUPABASE_DB_HOST }}
        run: |
          if [ -z "$MIRROR_IMPORT_PASSWORD" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::notice::Geen MIRROR_IMPORT_PASSWORD; importgebruiker niet ingesteld."
            exit 0
          fi
          echo "::add-mask::$MIRROR_IMPORT_PASSWORD"
          export PGPASSWORD="$SUPABASE_DB_PASSWORD"
          echo "alter role oxpecker_import with login password :'pw';" | psql -q -v ON_ERROR_STOP=1 -v pw="$MIRROR_IMPORT_PASSWORD" \
            "host=$SUPABASE_DB_HOST port=5432 dbname=postgres user=postgres.$SUPABASE_PROJECT_ID sslmode=require"

      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # Publieke Supabase-waarden (bedoeld om in de app te staan). Ingesteld als repository-variabelen.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_ERAFORCE_DOMEIN: ${{ vars.VITE_ERAFORCE_DOMEIN }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publiceer:
    needs: bouw
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
